[package]
name = "askllm"
version = "0.1.0"
edition = "2021"
description = "A concise streaming command-line interface for OpenAI-compatible LLM APIs"

[dependencies]
anyhow = "1"
bytes = "1"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
